<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Money Reels">
<title>Money Reels</title>
<style>
:root{--gain:#4ade80;--loss:#fb7185;--acc:#fcd34d;--blue:#7dd3fc;--ink:#fff;--mute:rgba(255,255,255,.72);--glass:rgba(10,10,14,.42);--line:rgba(255,255,255,.14);--navh:52px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--ink);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg{display:block}
#app{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:min(100vw,calc(100dvh * 9 / 16 + 40px));background:#000;overflow:hidden}
@media (min-width:700px){#app{border-left:1px solid #222;border-right:1px solid #222}}

/* top bar */
#top{position:absolute;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;pointer-events:none;background:linear-gradient(rgba(0,0,0,.45),transparent)}
#top>*{pointer-events:auto}
#ttl{display:flex;align-items:center;gap:4px;font-size:22px;font-weight:800;letter-spacing:-.3px;text-shadow:0 1px 6px rgba(0,0,0,.4)}
#ttl small{font-size:13px;font-weight:600;color:var(--mute);margin-left:6px;text-shadow:none}
#topR{display:flex;gap:16px;align-items:center}
.ico{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 3px rgba(0,0,0,.45))}

/* feed */
#feed{position:absolute;top:0;left:0;right:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom));overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
#feed::-webkit-scrollbar{display:none}
.reel{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;user-select:none;-webkit-user-select:none}

/* animated "video" background */
.bg{position:absolute;inset:0;background:var(--g1);overflow:hidden}
.bg:before,.bg:after{content:"";position:absolute;width:120%;aspect-ratio:1;border-radius:50%;filter:blur(60px);opacity:.75}
.bg:before{background:var(--g2);top:-30%;left:-40%;animation:drift1 14s ease-in-out infinite alternate}
.bg:after{background:var(--g3);bottom:-35%;right:-45%;animation:drift2 17s ease-in-out infinite alternate}
.reel.paused .bg:before,.reel.paused .bg:after,.reel.paused .disc{animation-play-state:paused}
@keyframes drift1{to{transform:translate(30%,25%) scale(1.15)}}
@keyframes drift2{to{transform:translate(-30%,-20%) scale(1.2)}}
.shade{position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.72)),linear-gradient(rgba(0,0,0,.25),transparent 20%)}

/* content on the "video" */
.stage{position:absolute;left:0;right:66px;top:calc(env(safe-area-inset-top) + 66px);bottom:160px;overflow:hidden;padding:0 0 0 14px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.stage>.slide,.stage>.scene{flex:none}
.kick{align-self:flex-start;display:flex;gap:8px;align-items:center;font-size:11.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.kick .pill{background:rgba(255,255,255,.95);color:#111;padding:4px 9px;border-radius:6px}
.kick .when{color:var(--mute)}
.hl{margin:0;font-size:clamp(22px,6.4vw,28px);line-height:1.12;font-weight:800;letter-spacing:-.4px;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.reel.live .hl{animation:rise .6s ease both}
.reel.live .card{animation:rise .7s .12s ease both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.card{background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border:1px solid var(--line);border-radius:18px;padding:14px 15px;flex:none}
.vt{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--mute);margin-bottom:8px;font-weight:700}
.gain{color:var(--gain)}.loss{color:var(--loss)}.acc{color:var(--acc)}
.big{font-size:clamp(44px,14vw,62px);font-weight:900;letter-spacing:-2px;line-height:1}
.lbl{color:#eef;margin:6px 0 8px;font-size:14px}
.fact,.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.row:first-of-type{border-top:0}
.fact small,.row small{display:block;color:var(--mute);font-size:11.5px;font-weight:400}
.fact b,.row .v{white-space:nowrap;font-weight:800;text-align:right}
.row .k{font-weight:600}
.row .v small{font-weight:700;font-size:12px}
.foot{margin-top:6px;color:var(--mute);font-size:11.5px}
.deal{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.08);margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;border-left:4px solid var(--acc);font-size:14px}
.deal:last-child{margin-bottom:0}
.deal.ok{border-color:var(--gain)}.deal.bad{border-color:var(--loss)}
.deal small{display:block;color:var(--mute);font-size:11.5px;margin-top:2px}.deal .amt{font-size:19px;font-weight:900;white-space:nowrap}
.tl{position:relative;padding-left:22px}.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.ti{position:relative;margin-bottom:11px;font-size:14px}.ti:last-child{margin-bottom:0}
.ti:before{content:"";position:absolute;left:-22px;top:4px;width:12px;height:12px;border-radius:50%;background:#222;border:2px solid rgba(255,255,255,.6)}
.ti.now:before{background:var(--acc);border-color:var(--acc);box-shadow:0 0 0 4px rgba(252,211,77,.25)}
.ti .d{font-size:10.5px;letter-spacing:.8px;color:var(--acc);font-weight:800}.ti small{display:block;color:var(--mute);font-size:12px}
.vs{display:flex;gap:14px;align-items:flex-end;height:min(200px,26vh)}
.vs>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.vs .bar{border-radius:12px 12px 4px 4px;min-height:6px;transform-origin:bottom}
.reel.live .vs .bar{animation:grow .9s .25s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}}
.vs .n{font-size:24px;font-weight:900;margin:6px 0 0}.vs .l{color:var(--mute);font-size:12px}
.sym{font-size:32px;font-weight:900}.ex{color:var(--mute);font-size:12px;margin-left:6px}
.pts{margin:0;padding:0;list-style:none}.pts li{padding:8px 0 8px 22px;border-top:1px solid var(--line);position:relative;font-size:14px}
.pts li:first-child{border-top:0}.pts li:before{content:"";position:absolute;left:3px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--gain)}

/* right action rail */
.rail{position:absolute;right:8px;bottom:22px;width:52px;display:flex;flex-direction:column;align-items:center;gap:18px;z-index:5}
.act{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.act .ico{width:29px;height:29px}
.act.on .heart{fill:#ff3040;stroke:#ff3040}
.act.on .mark{fill:#fff}
.act:active{transform:scale(.88)}
.disc{width:30px;height:30px;border-radius:8px;border:2px solid #fff;background:var(--g2);animation:spin 6s linear infinite;display:flex;align-items:center;justify-content:center;font-size:14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* bottom info */
.info{position:absolute;left:14px;right:72px;bottom:16px;z-index:5;display:flex;flex-direction:column;gap:9px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.who{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px}
.av{width:32px;height:32px;border-radius:50%;padding:2px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);flex:none}
.av span{display:flex;width:100%;height:100%;border-radius:50%;background:#111;border:2px solid #000;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#fff;text-shadow:none}
.fol{border:1px solid rgba(255,255,255,.75);border-radius:8px;padding:3px 10px;font-size:13px;font-weight:700}
.fol.on{background:rgba(255,255,255,.2);border-color:transparent}
.cap{font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.cap.open{display:block;-webkit-line-clamp:unset;max-height:30vh;overflow:auto}
.cap .mo{color:var(--mute)}
.aud{display:flex;align-items:center;gap:6px;font-size:13px;overflow:hidden;white-space:nowrap}
.aud .mq{overflow:hidden;flex:1;mask-image:linear-gradient(90deg,#000 80%,transparent)}
.aud .mq span{display:inline-block;padding-left:0;animation:mq 12s linear infinite}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.reel.paused .aud .mq span{animation-play-state:paused}

/* playback bar */
.pbar{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.25);z-index:6}
.pbar i{display:block;height:100%;width:0;background:#fff}
.reel.live .pbar i{animation:pb var(--dur,14s) linear infinite}
.reel.paused .pbar i{animation-play-state:paused}
@keyframes pb{to{width:100%}}

/* big heart + pause glyph */
.pop{position:absolute;left:50%;top:45%;width:110px;height:110px;margin:-55px 0 0 -55px;fill:#fff;opacity:0;pointer-events:none;z-index:8;filter:drop-shadow(0 4px 18px rgba(0,0,0,.35))}
.pop.go{animation:pop .9s ease}
@keyframes pop{0%{opacity:0;transform:scale(.3) rotate(-12deg)}15%{opacity:1;transform:scale(1.15) rotate(-8deg)}30%{transform:scale(.95)}70%{opacity:1}100%{opacity:0;transform:scale(1.1) translateY(-40px)}}
.pz{position:absolute;left:50%;top:45%;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:7;pointer-events:none}
.reel.paused .pz{display:flex}

/* explainer "video" */
.segs{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 52px);display:flex;gap:4px;z-index:6}
.segs i{flex:1;height:2.5px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.segs i b{display:block;height:100%;width:0;background:#fff}
.segs i.done b{width:100%}
.segs i.on b{animation:seg 5s linear forwards}
.reel.paused .segs i.on b{animation-play-state:paused}
@keyframes seg{to{width:100%}}
.scene{display:none;flex-direction:column;gap:12px}
.scene.on{display:flex;animation:rise .5s ease both}
.scene .k{align-self:flex-start;background:var(--acc);color:#111;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.9px;padding:4px 9px;border-radius:6px}
.scene .t{font-size:clamp(28px,8.6vw,38px);font-weight:900;line-height:1.05;letter-spacing:-.8px;text-shadow:0 2px 16px rgba(0,0,0,.35)}
.scene .s{font-size:17px;color:#f2f2f7;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.flow{display:flex;flex-direction:column;gap:6px}.flow div{padding:10px 14px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-weight:600}
.flow div:not(:last-child):after{content:"↓";display:block;text-align:center;color:var(--mute);margin-top:4px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.split div{padding:12px;border-radius:12px;background:var(--glass);border:1px solid var(--line)}.split .wide{grid-column:1/-1}
.split small{display:block;color:var(--mute);font-size:12px}.split b{font-size:22px}
.dca{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:20px}
.dca div{flex:1;background:var(--blue);border-radius:6px 6px 0 0;position:relative;min-height:6px}
.dca span{position:absolute;top:-19px;left:0;right:0;text-align:center;font-size:12px;color:var(--mute)}
.tapL,.tapR{position:absolute;top:90px;bottom:150px;z-index:4}.tapL{left:0;width:25%}.tapR{right:66px;width:28%}


/* story slides (news) */
.slide{display:none;flex-direction:column;gap:12px;transform-origin:left center}
.slide.on{display:flex;animation:rise .45s ease both}
.slide.cover.on .card{animation:rise .6s .1s ease both}
.sk{align-self:flex-start;background:rgba(255,255,255,.95);color:#111;font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:5px 10px;border-radius:7px}
.sk.gain{background:var(--gain)}
.st{margin:0;font-size:17px;line-height:1.2;color:var(--mute);font-weight:700}
.txt{background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:4px 16px;overflow:auto;min-height:0}
.txt p{font-size:16px;line-height:1.45;margin:12px 0}
.mv{margin:0;padding:0;list-style:none;counter-reset:m;display:flex;flex-direction:column;gap:9px;overflow:auto;min-height:0}
.mv li{counter-increment:m;position:relative;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 48px;font-size:15.5px;line-height:1.38;font-weight:500}
.mv li:before{content:counter(m);position:absolute;left:12px;top:11px;width:26px;height:26px;border-radius:50%;background:var(--gain);color:#06210f;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:14px}
.risk{background:rgba(251,113,133,.16);border:1px solid rgba(251,113,133,.45);border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.38}
.risk b{display:block;margin-bottom:3px;color:#ffd1d9}
.srcs{display:flex;flex-direction:column;gap:9px}
.srcs a{display:block;color:#fff;text-decoration:none;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:12px 14px;position:relative;z-index:6}
.srcs b{display:block;font-size:15px;line-height:1.3}.srcs small{color:#9fd6ff;font-size:12.5px}

@media (max-height:720px){.rail{gap:10px;bottom:14px}.act .ico{width:25px;height:25px}.act span{font-size:11px}.disc{width:26px;height:26px}.info{right:66px}}
/* bottom nav */
#nav{position:absolute;left:0;right:0;bottom:0;height:calc(var(--navh) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#000;border-top:1px solid #1d1d1f;display:flex;justify-content:space-around;align-items:center;z-index:30}
#nav button{padding:10px 14px}
#nav .ico{filter:none}
#nav .me{width:26px;height:26px;border-radius:50%;background:linear-gradient(45deg,#feda75,#d62976,#4f5bd5);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}

/* sheets */
.sheet{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.55);display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet .in{width:100%;max-height:82%;overflow:auto;background:#1c1c1e;border-radius:18px 18px 0 0;padding:8px 16px calc(env(safe-area-inset-bottom) + 24px);animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:40px;height:4px;border-radius:2px;background:#5a5a5e;margin:4px auto 10px}
.sh{font-weight:800;text-align:center;font-size:15px;padding-bottom:10px;border-bottom:1px solid #2c2c2e;margin:0 -16px 12px}
.sheet h2{font-size:19px;margin:6px 0 10px;line-height:1.2}
.sheet h3{margin:16px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:#8e8e93}
.sheet p,.sheet li{color:#e5e5ea;font-size:15px}.sheet ul{padding-left:20px;margin:6px 0}
.sheet a{color:#4cb5f9;word-break:break-word;text-decoration:none}
.sheet .note{color:#8e8e93;font-size:12px;margin-top:16px}
.cat{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 4px;border-bottom:1px solid #2c2c2e;font-size:16px;text-align:left}
.cat .dot{width:14px;height:14px;border-radius:50%;margin-right:12px;flex:none}
.cat .l{display:flex;align-items:center}
.cat .n{color:#8e8e93;font-size:13px}
.cat.on{font-weight:800}.cat.on .n:after{content:"  ✓";color:#fff}

#toast{position:absolute;left:50%;bottom:calc(var(--navh) + 30px);transform:translateX(-50%);background:rgba(40,40,44,.95);padding:9px 16px;border-radius:10px;font-size:14px;z-index:70;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;text-align:center;color:var(--mute);padding:30px;z-index:20}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid #333;border-top-color:#fff;animation:spin 0.8s linear infinite}
.empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--mute)}
</style>
</head>
<body>
<div id="app">
 <div id="top">
  <button id="ttl" aria-label="Choose topic">Reels<svg class="ico" style="width:18px;height:18px" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg><small id="sub"></small></button>
  <div id="topR">
   <button id="snd" aria-label="Sound"><svg class="ico" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="sndW" d="M17 9l4 6M21 9l-4 6"/></svg></button>
   <button id="rf" aria-label="Refresh"><svg class="ico" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg></button>
  </div>
 </div>
 <div id="feed"></div>
 <div id="msg"><div class="spin"></div>Loading reels…</div>
 <nav id="nav">
  <button data-go="home" aria-label="Home"><svg class="ico" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></button>
  <button data-go="topics" aria-label="Topics"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
  <button data-go="reels" aria-label="Reels"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M3 8.5h18M9 3l3 5.5M14.5 3l3 5.5"/><path d="M10 12v5l4.5-2.5z" fill="#fff"/></svg></button>
  <button data-go="saved" aria-label="Saved"><svg class="ico" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-5-6 5z"/></svg></button>
  <button data-go="me" aria-label="Profile"><span class="me">MR</span></button>
 </nav>
 <div class="sheet" id="det"><div class="in" id="detIn"></div></div>
 <div class="sheet" id="cats"><div class="in" id="catsIn"></div></div>
 <div id="toast"></div>
</div>
<script>
// The app and posts.json live in the same repo (shadowprivacyscam-ship-it/money-reels-hourly-posts).
const RAW="https://raw.githubusercontent.com/shadowprivacyscam-ship-it/money-reels-hourly-posts/main/posts.json";
const CATS=[["all","For you"],["markets","Markets"],["ai","AI"],["taxes","Taxes"],["benefits","Benefits"],["states","States"],["california","California"],["business","Business"],["immigration","Immigration"],["crypto","Crypto"],["politics","Politics"],["world","World"],["learn","Learn"],["saved","Saved"]];
// per-category "video" gradients [base, blob1, blob2]
const PAL={markets:["#06281f","#0f766e","#1d4ed8"],ai:["#1e0b3a","#7c3aed","#db2777"],taxes:["#2a1a05","#b45309","#9f1239"],benefits:["#062033","#0369a1","#059669"],states:["#1a1033","#4338ca","#0891b2"],california:["#2b1205","#ea580c","#be185d"],business:["#111827","#475569","#0e7490"],immigration:["#141a2e","#334155","#6d28d9"],crypto:["#1f1300","#d97706","#7c3aed"],politics:["#1f0a14","#9d174d","#1e40af"],world:["#0a1a1f","#155e75","#a16207"],learn:["#1a0f00","#f59e0b","#e11d48"]};
const HANDLE={markets:"markets",ai:"ai",taxes:"taxes",benefits:"benefits",states:"states",california:"cali",business:"business",immigration:"immigration",crypto:"crypto",politics:"politics",world:"world",learn:"learn"};
const $=s=>document.querySelector(s);

function fit(el,stage){el.style.zoom=1;requestAnimationFrame(()=>{const avail=stage.clientHeight,need=el.scrollHeight;if(need>avail&&avail>0)el.style.zoom=Math.max(.6,(avail/need)*0.98).toFixed(3)})}

let io;

function ago(t){const m=Math.round((Date.now()-new Date(t))/60000);if(isNaN(m))return"";return m<2?"just now":m<90?m+"m ago":m<2880?Math.round(m/60)+"h ago":Math.round(m/1440)+"d ago"}
async function load(manual){
 let data=null;
 for(const u of[RAW+"?t="+Math.floor(Date.now()/60000),"posts.json?t="+Date.now()]){
  try{const r=await fetch(u,{cache:"no-store"});if(r.ok){data=await r.json();break}}catch(e){}}

 if(!data||!Array.isArray(data.items)){if(m)m.replaceChildren("Couldn't load reels. Tap ↻ to retry.");else if(manual)toast("Couldn't refresh");return}
 if(m)m.remove();
 if(data.updated===LAST){if(manual)toast("Up to date · "+ago(data.updated));return}
 LAST=data.updated;ITEMS=data.items.filter(x=>x&&x.id&&x.headline);
 if(cat!=="all"&&cat!=="saved"&&!ITEMS.some(x=>x.cat===cat||(x.tags||[]).includes(cat)))cat="all";
 render();if(manual)toast("Updated "+ago(data.updated))}
setSnd();load();
setInterval(()=>{if(document.visibilityState==="visible"&&!document.querySelector(".sheet.on")&&$("#feed").scrollTop<10)load()},15*60*1000);
